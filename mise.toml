[tools]
"npm:@changesets/cli" = "3.0.3"

[tasks.bump]
description = "Record a patch, minor, or major release bump for a PR"
run = "changeset add"

[tasks.no-release]
description = "Record that a PR needs no release"
run = "changeset add --empty"

[tasks.effect]
run = """
git subtree pull \
      --prefix=repos/effect \
      https://github.com/Effect-TS/effect.git \
      main \
      --squash
"""
