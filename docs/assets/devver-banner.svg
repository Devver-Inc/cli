<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Devver — from code to feedback</title>
  <desc id="desc">Deploy locally or in the cloud, test, share, gather feedback, and move to the next feature with your team and agents.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121c30"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
  </defs>
