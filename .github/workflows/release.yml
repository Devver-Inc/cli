name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: plan
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Planning release for $TAG (version $VERSION)"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone binary
        run: |
          bun run scripts/build.ts
        shell: bash

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf devver-cli-${{ matrix.target }}.tar.gz devver
          shasum -a 256 devver-cli-${{ matrix.target }}.tar.gz > devver-cli-${{ matrix.target }}.tar.gz.sha256

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          7z a devver-cli-${{ matrix.target }}.zip devver.exe
          (Get-FileHash devver-cli-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  devver-cli-${{ matrix.target }}.zip" | Out-File -Encoding utf8 devver-cli-${{ matrix.target }}.zip.sha256

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: devver-cli-${{ matrix.target }}
          path: |
            devver-cli-${{ matrix.target }}.tar.gz
            devver-cli-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: devver-cli-${{ matrix.target }}
          path: |
            devver-cli-${{ matrix.target }}.zip
            devver-cli-${{ matrix.target }}.zip.sha256

  release:
    name: Create GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec mv {} release/ \;

      - name: Generate release notes from changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract the latest version's changelog
            awk '/^## \[/{if(p) exit; p=1; next} p' CHANGELOG.md > release_notes.md
          else
            echo "Release ${{ needs.plan.outputs.tag }}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: false

  npm:
    name: Publish to npm
    needs: [plan, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (npm auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: [plan, release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.CLI_RELEASE_PAT }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -e

          # Extract organization and repo name from GITHUB_REPOSITORY
          ORG="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          # Clone the tap repository (adjust this to your actual tap repo)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${ORG}/homebrew-tap.git" tap || {
            echo "Homebrew tap repository not found. Skipping Homebrew update."
            exit 0
          }
          cd tap

          # Create Formula directory if it doesn't exist
          mkdir -p Formula

          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Download and compute SHA256 for each platform
          echo "Downloading artifacts and computing checksums..."

          curl -sL "${BASE_URL}/devver-cli-aarch64-apple-darwin.tar.gz" -o /tmp/arm64-darwin.tar.gz
          curl -sL "${BASE_URL}/devver-cli-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/x64-linux.tar.gz

          SHA_ARM64_DARWIN=$(sha256sum /tmp/arm64-darwin.tar.gz | cut -d' ' -f1)
          SHA_X64_LINUX=$(sha256sum /tmp/x64-linux.tar.gz | cut -d' ' -f1)

          echo "SHA256 (aarch64-apple-darwin): ${SHA_ARM64_DARWIN}"
          echo "SHA256 (x86_64-unknown-linux-gnu): ${SHA_X64_LINUX}"

          # Generate the formula
          cat > Formula/devver-cli.rb << EOF
          class DevverCli < Formula
            desc "Deploy and try your app in seconds"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/devver-cli-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM64_DARWIN}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "${BASE_URL}/devver-cli-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X64_LINUX}"
              end
            end

            def install
              bin.install "devver"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/devver --version")
            end
          end
          EOF

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/devver-cli.rb
          git commit -m "Update devver-cli to ${TAG}" || echo "No changes to commit"
          git push
