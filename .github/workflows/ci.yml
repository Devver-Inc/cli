name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run fix

      - name: Run tests
        run: |
          if ls **/*.test.* **/*.spec.* 1> /dev/null 2>&1; then
            bun test
          else
            echo "No test files found, skipping tests"
          fi
        shell: bash

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test standalone build
        run: |
          bun build ./src/index.tsx --compile --target=bun --outfile devver-cli-test
          ./devver-cli-test --version || echo "Build successful"
