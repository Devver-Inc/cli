name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting and lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  windows-server:
    name: Windows server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'

      - name: Install dependencies
        run: bun install

      # Windows instance state lives under the real per-user LOCALAPPDATA: an
      # XDG override fails closed, so these tests isolate by instance name.
      - name: Windows instance state and Task Scheduler supervision
        shell: bash
        run: bun test tests/windows-server.test.ts tests/server-identity.test.ts

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test standalone build
        run: |
          bun build ./src/cli/index.ts --compile --target=bun --outfile devver-test
          ./devver-test --version
