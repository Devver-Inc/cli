name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"

      - name: Synchronize release versions and locks
        run: bun run sync:version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: bun run check:version

      - name: Check formatting and lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build local npm fixture and run tests
        run: bun run scripts/build-npm-fixture.ts && bun run test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release intent on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
          RELEASE_PR: ${{ github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/v') }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
          if [ "$RELEASE_PR" = true ]; then
            VERSION=$(node -p "require('./package.json').version")
            BASE_VERSION=$(git show "origin/$BASE:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            test "$BRANCH" = "release/v$VERSION"
            test "$VERSION" != "$BASE_VERSION"
            grep -Fxq "## $VERSION" packages/cli/CHANGELOG.md
            git diff --diff-filter=AM --name-only "origin/$BASE...HEAD" -- packages/cli/CHANGELOG.md | grep -Fxq packages/cli/CHANGELOG.md
            git diff --diff-filter=D --name-only "origin/$BASE...HEAD" -- '.changeset/*.md' | grep -q .
          elif ! git diff --diff-filter=A --name-only "origin/$BASE...HEAD" -- '.changeset/*.md' | grep -q .; then
            echo 'Add a changeset with mise run bump, or an empty one with mise run no-release.' >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"

      - name: Synchronize release versions and locks
        run: bun run sync:version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate PR changesets
        if: ${{ github.event_name == 'pull_request' && !(github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/v')) }}
        run: bunx changeset status --since "origin/$GITHUB_BASE_REF"

      - name: Build and test CLI workspace
        run: |
          bun run --cwd packages/cli build
          bun run --cwd packages/cli test

      - name: Build and test server workspace
        run: |
          bun run --cwd packages/server build
          bun run --cwd packages/server test

      - name: Test standalone build
        run: |
          bun run build
          ./devver --version
          test -x servers/$(bun -p "require('./package.json').version")/devver-server
